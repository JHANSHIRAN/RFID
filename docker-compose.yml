version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: RF_ID
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./RFID
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/RF_ID
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
